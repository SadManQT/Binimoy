name: binimoy
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: lp
      POSTGRES_PASSWORD: lp_local_only
      POSTGRES_DB: lp
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lp -d lp"]
      interval: 2s
      timeout: 2s
      retries: 30
  # Secret vault homeserver (spec D.7). Run `pnpm matrix:local` once first.
  synapse:
    image: matrixdotorg/synapse@sha256:abeb932f2a9293fcbb886d5ddd0f55a34d532708ebb8dc5642934dd91ca26237
    profiles: ["matrix"]
    ports: ["127.0.0.1:8448:8008"]
    volumes:
      - ./synapse/data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  pgdata:
